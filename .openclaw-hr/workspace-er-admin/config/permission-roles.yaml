# 权限分级配置
# 基于 sender_id (open_id) 的角色映射
# 飞书通道的真实工具权限以 config/openclaw.yaml 的 toolsBySender 为准。
# 飞书不出月报：monthly-report 只在 Agent er-admin-cron。HR 档可 write，主管/员工/`*` deny write。

# 管理员 / HR 测试号（yaml：write + exec + read）
admin:
  - "ou_2f67ed66e57e214e72c318a57c60d1c4"   # HR（测试用户1）

hr_staff:
  - "ou_2f67ed66e57e214e72c318a57c60d1c4"   # 同 HR 测试号

# 部门主管（yaml：exec + read，deny write）
manager:
  - "ou_85759e2571f33307b6fc7b265060d5c1"   # 部门主管（测试用户2）

# 普通员工（默认）：exec + read，deny write。其它 ou_* 归入此类。

# 与 yaml 对齐的说明：
# - 全员可 ima-search 问政策（exec 业务入口）。
# - 禁止：飞书生成月报、用常识填政策、政策原文另存知识库。
# - HR 测试号可对本 workspace write/edit（冒烟/文档）；主管与员工不能写盘。
# - 月报、Gateway 配置、跨域操作不在飞书会话里做。
