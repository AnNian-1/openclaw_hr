admin:
  - "ou_2f67ed66e57e214e72c318a57c60d1c4"   # HR（测试用户1）

# HR 专员列表（可出月报、查看审计日志、管理知识库）
hr_staff:
  - "ou_2f67ed66e57e214e72c318a57c60d1c4"   # HR（测试用户1）- 同时也是管理员

# 部门主管列表（可查看团队相关数据）
manager:
  - "ou_85759e2571f33307b6fc7b265060d5c1"   # 部门主管（测试用户2）

# 普通员工（默认，无需配置）
# 其他所有 sender_id 自动归为普通员工

# 权限说明：
# Level 1 - 普通员工：
#   - 查询HR政策（只读）
#   - 禁止：月报生成、个人数据查询、审计日志
#
# Level 2 - 部门主管：
#   - Level 1 所有权限
#   - 查看团队考勤汇总（脱敏）
#   - 查看团队假期统计
#
# Level 3 - HR专员：
#   - Level 1 所有权限
#   - 生成月报
#   - 查看审计日志
#   - 知识库管理
#   - 员工信息查询（受限）
#
# Level 4 - 管理员：
#   - 所有权限
#   - Gateway 配置
#   - Skill 管理
#   - 跨域操作
#   - 用户角色管理
