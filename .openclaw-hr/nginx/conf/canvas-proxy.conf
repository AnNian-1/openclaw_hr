# Canvas hosted-documents 反代
# 作用：浏览器访问 http://127.0.0.1:18999/__openclaw__/canvas/... 时，
#       自动附加 Authorization: Bearer <token> 头，转发给 127.0.0.1:18790 Gateway。
# 设计目的：让 ssh -L 18790 隧道的用户本地浏览器可以无感访问 Canvas 文档，
#       不需要在浏览器里手动加 Bearer token。
#
# 注意：只 listen 127.0.0.1，外网访问不到；用户通过 ssh -L 18999:127.0.0.1:18999 隧道。

server {
    listen 127.0.0.1:18999 default_server;
    listen [::1]:18999 default_server;

    server_name _;

    access_log /home/yhwz/openclaw-hr/.openclaw-hr/nginx/logs/canvas-proxy.access.log;
    error_log  /home/yhwz/openclaw-hr/.openclaw-hr/nginx/logs/canvas-proxy.error.log warn;

    # 关键：把 Gateway Token 写到上游请求头
    # 来源：/home/yhwz/openclaw-hr/.openclaw-hr/env.sh 的 OPENCLAW_GATEWAY_TOKEN
    set $gateway_token "47141d208616a29dddbcae9cb47b3270a851585da5176739b02b9fa42434a6bc";

    # === 自适应高度注入片段（注入到 HTML </head> 前） ===
    # 用纯 JS 测量 body.scrollHeight，避免写死像素；
    # 对 WebChat iframe / 浏览器 / 任何嵌套环境都生效。
    set $canvas_autoheight "<style id='oc-canvas-autoheight-css'>html,body{height:auto!important;min-height:0!important;overflow:visible!important;}</style><script id='oc-canvas-autoheight-js'>(function(){function fit(){try{var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,document.body.offsetHeight,document.documentElement.offsetHeight)+40;document.documentElement.style.height=h+'px';document.body.style.minHeight=h+'px';}catch(e){}}if(document.readyState==='complete'){fit();}else{window.addEventListener('load',fit);}if(window.ResizeObserver){new ResizeObserver(fit).observe(document.body);}window.addEventListener('resize',fit);setTimeout(fit,200);setTimeout(fit,800);setTimeout(fit,2000);})();</script>";

    location / {
        proxy_pass http://127.0.0.1:18790;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === 这里注入 Bearer token ===
        proxy_set_header Authorization    "Bearer $gateway_token";

        # WebSocket（A2UI live reload 用，本配置 liveReload=false 用不到，留着也无害）
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
        proxy_redirect      off;

        # === 自适应高度：替换 </head>，不区分大小写，仅作用于 text/html ===
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '</head>' '$canvas_autoheight</head>';
    }

    # 健康检查
    location = /__openclaw__/healthz {
        access_log off;
        return 200 "canvas-proxy ok\n";
        add_header Content-Type text/plain;
    }
}

# WebSocket upgrade 映射（与 proxy_set_header Connection 对应）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
