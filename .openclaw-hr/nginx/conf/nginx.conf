worker_processes 1;
pid /opt/openclaw-hr/.openclaw-hr/nginx/nginx.pid;
error_log /opt/openclaw-hr/.openclaw-hr/nginx/logs/error.log warn;
events { worker_connections 64; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /opt/openclaw-hr/.openclaw-hr/nginx/logs/access.log;
    client_body_temp_path /opt/openclaw-hr/.openclaw-hr/nginx/temp_client_body;
    proxy_temp_path       /opt/openclaw-hr/.openclaw-hr/nginx/temp_proxy;
    fastcgi_temp_path     /opt/openclaw-hr/.openclaw-hr/nginx/temp_fastcgi;
    uwsgi_temp_path       /opt/openclaw-hr/.openclaw-hr/nginx/temp_uwsgi;
    scgi_temp_path        /opt/openclaw-hr/.openclaw-hr/nginx/temp_scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    include /opt/openclaw-hr/.openclaw-hr/nginx/conf/canvas-proxy.conf;
}
